name: Quality Fast

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/web/**'
      - 'apps/wordpress/**'
      - 'packages/**'
      - 'infrastructure/scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://staging.netmarket.it
  PUBLIC_CMS_URL: https://cms.netmarket.it
  PUBLIC_DEPLOY_ENV: staging
  PUBLIC_BUILD_SHA: ${{ github.sha }}
  PUBLIC_BUILD_TIME: 1970-01-01T00:00:00Z
  CMS_API_BASE_URL: https://cms.netmarket.it/wp-json/netmarket/v1/
  CMS_BASIC_AUTH_USER: ${{ secrets.CMS_BASIC_AUTH_USER }}
  CMS_BASIC_AUTH_PASSWORD: ${{ secrets.CMS_BASIC_AUTH_PASSWORD }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      wordpress: ${{ steps.filter.outputs.wordpress }}
      shared: ${{ steps.filter.outputs.shared }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/web/**'
            wordpress:
              - 'apps/wordpress/**'
            shared:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            infrastructure:
              - 'infrastructure/scripts/**'
            ci:
              - '.github/workflows/**'

  fast-checks:
    needs: changes
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.infrastructure == 'true' ||
        needs.changes.outputs.ci == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, unit, build
        run: pnpm check:fast

  wordpress-fast:
    needs: changes
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.wordpress == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.ci == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            apps/wordpress/plugins/netmarket-headless-core/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/wordpress/plugins/netmarket-headless-core/composer.lock') }}
      - name: Install Composer dependencies
        working-directory: apps/wordpress/plugins/netmarket-headless-core
        run: composer install --no-interaction --prefer-dist
      - name: PHP lint
        run: find apps/wordpress/plugins/netmarket-headless-core -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: PHPCS
        working-directory: apps/wordpress/plugins/netmarket-headless-core
        run: composer run phpcs

  secrets-fast:
    needs: changes
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.wordpress == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.infrastructure == 'true' ||
        needs.changes.outputs.ci == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:scan
