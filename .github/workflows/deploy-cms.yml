name: Deploy CMS Plugin

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Esegui solo simulazione
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cms-deploy-staging
      cancel-in-progress: true
    env:
      TARGET_HOST: cms.netmarket.it
      SG_CMS_SSH_HOST: ${{ secrets.SG_CMS_SSH_HOST || secrets.SG_SSH_HOST }}
      SG_CMS_SSH_PORT: ${{ secrets.SG_CMS_SSH_PORT || secrets.SG_SSH_PORT }}
      SG_CMS_SSH_USER: ${{ secrets.SG_CMS_SSH_USER || secrets.SG_SSH_USER }}
      SG_CMS_SSH_PRIVATE_KEY: ${{ secrets.SG_CMS_SSH_PRIVATE_KEY || secrets.SG_SSH_PRIVATE_KEY }}
      SG_CMS_SSH_KNOWN_HOSTS: ${{ secrets.SG_CMS_SSH_KNOWN_HOSTS || secrets.SG_SSH_KNOWN_HOSTS }}
      SG_CMS_WORDPRESS_PATH: ${{ secrets.SG_CMS_WORDPRESS_PATH }}
      CMS_BASIC_AUTH_USER: ${{ secrets.CMS_BASIC_AUTH_USER }}
      CMS_BASIC_AUTH_PASSWORD: ${{ secrets.CMS_BASIC_AUTH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard CMS target
        run: |
          test "$TARGET_HOST" = "cms.netmarket.it"
          test "$SG_CMS_WORDPRESS_PATH" != "/"
          case "$SG_CMS_WORDPRESS_PATH" in
            *cms.netmarket.it*) ;;
            *) echo "::error::SG_CMS_WORDPRESS_PATH must target cms.netmarket.it"; exit 1 ;;
          esac
      - name: Check SSH secrets
        run: |
          missing=0
          check_secret() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::Missing required CMS deploy secret: $name"
              missing=1
            fi
          }

          check_secret "SG_CMS_SSH_HOST or SG_SSH_HOST" "$SG_CMS_SSH_HOST"
          check_secret "SG_CMS_SSH_PORT or SG_SSH_PORT" "$SG_CMS_SSH_PORT"
          check_secret "SG_CMS_SSH_USER or SG_SSH_USER" "$SG_CMS_SSH_USER"
          check_secret "SG_CMS_SSH_PRIVATE_KEY or SG_SSH_PRIVATE_KEY" "$SG_CMS_SSH_PRIVATE_KEY"
          check_secret "SG_CMS_SSH_KNOWN_HOSTS or SG_SSH_KNOWN_HOSTS" "$SG_CMS_SSH_KNOWN_HOSTS"
          check_secret "SG_CMS_WORDPRESS_PATH" "$SG_CMS_WORDPRESS_PATH"
          check_secret "CMS_BASIC_AUTH_USER" "$CMS_BASIC_AUTH_USER"
          check_secret "CMS_BASIC_AUTH_PASSWORD" "$CMS_BASIC_AUTH_PASSWORD"

          exit "$missing"
      - name: Dry-run CMS plugin deploy
        if: ${{ inputs.dry_run == 'true' }}
        run: infrastructure/scripts/bootstrap-wordpress.sh --domain cms.netmarket.it --path "$SG_CMS_WORDPRESS_PATH"
        env:
          SG_SSH_HOST: ${{ env.SG_CMS_SSH_HOST }}
          SG_SSH_PORT: ${{ env.SG_CMS_SSH_PORT }}
          SG_SSH_USER: ${{ env.SG_CMS_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ env.SG_CMS_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ env.SG_CMS_SSH_KNOWN_HOSTS }}
      - name: Deploy and activate CMS plugin
        if: ${{ inputs.dry_run == 'false' }}
        run: infrastructure/scripts/bootstrap-wordpress.sh --execute --domain cms.netmarket.it --path "$SG_CMS_WORDPRESS_PATH"
        env:
          SG_SSH_HOST: ${{ env.SG_CMS_SSH_HOST }}
          SG_SSH_PORT: ${{ env.SG_CMS_SSH_PORT }}
          SG_SSH_USER: ${{ env.SG_CMS_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ env.SG_CMS_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ env.SG_CMS_SSH_KNOWN_HOSTS }}
      - name: Harden CMS access and indexing
        if: ${{ inputs.dry_run == 'false' }}
        run: infrastructure/scripts/harden-cms.sh --domain cms.netmarket.it --path "$SG_CMS_WORDPRESS_PATH"
        env:
          SG_SSH_HOST: ${{ env.SG_CMS_SSH_HOST }}
          SG_SSH_PORT: ${{ env.SG_CMS_SSH_PORT }}
          SG_SSH_USER: ${{ env.SG_CMS_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ env.SG_CMS_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ env.SG_CMS_SSH_KNOWN_HOSTS }}
      - name: Health check
        if: ${{ inputs.dry_run == 'false' }}
        run: node infrastructure/scripts/pull-cms-cache.mjs
        env:
          SG_SSH_HOST: ${{ env.SG_CMS_SSH_HOST }}
          SG_SSH_PORT: ${{ env.SG_CMS_SSH_PORT }}
          SG_SSH_USER: ${{ env.SG_CMS_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ env.SG_CMS_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ env.SG_CMS_SSH_KNOWN_HOSTS }}
