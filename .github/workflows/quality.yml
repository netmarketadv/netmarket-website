name: CMS Edge Probe Read Only
run-name: Public CMS edge probe (no CMS credentials, no release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
      - name: Classify public health responses without authentication or challenge solving
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const results = [];
          for (let attempt = 1; attempt <= 3; attempt++) {
            const entry = { attempt, time: new Date().toISOString(), node: process.version };
            try {
              const response = await fetch('https://cms.netmarket.it/wp-json/netmarket/v1/health', {
                headers: { Accept: 'application/json' },
                redirect: 'error',
                signal: AbortSignal.timeout(30000)
              });
              const body = await response.text();
              entry.httpStatus = response.status;
              entry.contentType = response.headers.get('content-type');
              entry.origin = new URL(response.url).origin;
              entry.bytes = Buffer.byteLength(body);
              entry.sha256 = createHash('sha256').update(body).digest('hex');
              const lower = body.toLowerCase();
              entry.markers = ['captcha', '.well-known/captcha', 'checking your browser', 'challenge', 'siteground', 'access denied'].filter(marker => lower.includes(marker));
              try {
                const payload = JSON.parse(body);
                entry.format = 'json';
                entry.healthOk = payload.status === 'ok';
              } catch {
                entry.format = /<html|<!doctype/i.test(body) ? 'html' : 'non-json';
              }
            } catch {
              entry.reason = 'transport-or-redirect-error';
            }
            results.push(entry);
            if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.log(JSON.stringify(results, null, 2));
          writeFileSync('public-cms-edge.json', JSON.stringify(results, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: public-cms-edge-${{ github.run_id }}
          path: public-cms-edge.json
          retention-days: 1
