name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate completo senza deploy oppure pubblicazione approvata
        type: choice
        options: [candidate, deploy]
        default: candidate
      candidate_run_id:
        description: Per deploy, ID della run candidate riuscita da pubblicare senza rebuild
        required: false
        default: ''
        type: string
      expected_live_sha:
        description: SHA effettivamente online prima del candidate/deploy
        required: true
        type: string
        default: 6b2e5524ba43e237229e0f56e86161edd87e1165
      confirm:
        description: Scrivi BUILD NETMARKET CANDIDATE oppure DEPLOY NETMARKET
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require actual production approval policy
        run: node infrastructure/scripts/check-production-protection.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify confirmation and published base
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$MODE" = candidate ]; then
            test "$CONFIRM" = 'BUILD NETMARKET CANDIDATE'
          elif [ "$MODE" = deploy ]; then
            test "$CONFIRM" = 'DEPLOY NETMARKET'
          else
            exit 1
          fi
          git merge-base --is-ancestor "$EXPECTED_LIVE_SHA" "$GITHUB_SHA"

      - name: Verify successful immutable candidate run
        if: ${{ inputs.mode == 'deploy' }}
        run: node infrastructure/scripts/check-production-candidate-run.mjs
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}

  candidate:
    name: Full QA and Immutable Candidate
    if: ${{ inputs.mode == 'candidate' }}
    needs: guard
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: production-candidate-${{ github.sha }}
      cancel-in-progress: false
    env:
      PUBLIC_SITE_URL: https://netmarket.it
      PUBLIC_CMS_URL: https://cms.netmarket.it
      PUBLIC_DEPLOY_ENV: production
      PUBLIC_ANALYTICS_ENABLED: 'true'
      PUBLIC_GTM_ID: GTM-K782CJ46
      PUBLIC_BUILD_SHA: ${{ github.sha }}
      CMS_API_BASE_URL: https://cms.netmarket.it/wp-json/netmarket/v1/
      CMS_BASIC_AUTH_USER: ${{ secrets.CMS_BASIC_AUTH_USER }}
      CMS_BASIC_AUTH_PASSWORD: ${{ secrets.CMS_BASIC_AUTH_PASSWORD }}
      EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
      TARGET_HOST: netmarket.it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard production target
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$TARGET_HOST" = "netmarket.it"
          test "$PUBLIC_SITE_URL" = "https://netmarket.it"
          test "$PUBLIC_DEPLOY_ENV" = "production"

      - name: Check existing CMS secrets
        run: |
          test -n "$CMS_BASIC_AUTH_USER"
          test -n "$CMS_BASIC_AUTH_PASSWORD"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: pnpm

      - name: Recheck approval policy after environment gate
        run: node infrastructure/scripts/check-production-protection.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published base over authenticated SSH (read-only)
        run: |
          bootstrap=stape
          if [ "$EXPECTED_LIVE_SHA" = 6b2e5524ba43e237229e0f56e86161edd87e1165 ]; then bootstrap=google; fi
          bash infrastructure/scripts/verify-production-release.sh --host netmarket.it --path "$SG_PRODUCTION_DEPLOY_PATH" --sha "$EXPECTED_LIVE_SHA" --bootstrap "$bootstrap"
        env:
          SG_SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_SSH_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_SSH_USER: ${{ secrets.SG_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_SSH_KNOWN_HOSTS }}
          SG_PRODUCTION_DEPLOY_PATH: ${{ secrets.SG_PRODUCTION_DEPLOY_PATH }}

      - name: Check authenticated CMS readiness before quality/build
        run: node infrastructure/scripts/preflight-production-cms.mjs

      - name: Stamp build time
        run: echo "PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Install PHP quality tools
        working-directory: apps/wordpress/plugins/netmarket-headless-core
        run: composer install --no-interaction --prefer-dist

      - name: Full validation (deterministic local build, not the release artifact)
        run: pnpm validate
        env:
          PUBLIC_DEPLOY_ENV: local
          PUBLIC_SITE_URL: http://localhost:4321
          PUBLIC_ANALYTICS_ENABLED: 'false'
          PUBLIC_GTM_ID: ''
          CMS_BASIC_AUTH_USER: ''
          CMS_BASIC_AUTH_PASSWORD: ''

      - name: Install Playwright browser
        run: pnpm --filter @netmarket/web exec playwright install --with-deps chromium

      - name: Full E2E (local tracking disabled)
        run: pnpm test:e2e
        env:
          PUBLIC_DEPLOY_ENV: local
          PUBLIC_SITE_URL: http://localhost:4321
          PUBLIC_ANALYTICS_ENABLED: 'false'
          PUBLIC_GTM_ID: ''
          CMS_BASIC_AUTH_USER: ''
          CMS_BASIC_AUTH_PASSWORD: ''

      - name: Verify approved tracking invariants
        run: node infrastructure/scripts/verify-stape-invariants.mjs

      - name: Build authenticated production candidate without CMS fallback
        run: node infrastructure/scripts/build-production-candidate.mjs

      - name: Production tracking smoke against the exact candidate (external requests mocked)
        run: |
          set -Eeuo pipefail
          pnpm --filter @netmarket/web preview --host 127.0.0.1 --port 4322 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4322/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4322/ >/dev/null
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4322 PLAYWRIGHT_ISOLATE_EXTERNALS=true pnpm test:e2e
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4322 STAPE_EXPECT_TRACKING=true pnpm test:e2e:smoke stape-tracking.spec.ts

      - name: Upload validated production candidate
        uses: actions/upload-artifact@v4
        with:
          name: production-candidate-${{ github.sha }}
          path: artifacts/production-candidate-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics (never a valid production artifact)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-diagnostics-${{ github.sha }}
          path: artifacts/production-candidate-${{ github.sha }}/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish Exact Approved Artifact
    if: ${{ inputs.mode == 'deploy' }}
    needs: guard
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PUBLIC_SITE_URL: https://netmarket.it
      PUBLIC_DEPLOY_ENV: production
      PUBLIC_BUILD_SHA: ${{ github.sha }}
      EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck production policy and candidate run after approval
        run: |
          node infrastructure/scripts/check-production-protection.mjs
          node infrastructure/scripts/check-production-candidate-run.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify published base over authenticated SSH (read-only)
        run: |
          bootstrap=stape
          if [ "$EXPECTED_LIVE_SHA" = 6b2e5524ba43e237229e0f56e86161edd87e1165 ]; then bootstrap=google; fi
          bash infrastructure/scripts/verify-production-release.sh --host netmarket.it --path "$SG_PRODUCTION_DEPLOY_PATH" --sha "$EXPECTED_LIVE_SHA" --bootstrap "$bootstrap"
        env:
          SG_SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_SSH_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_SSH_USER: ${{ secrets.SG_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_SSH_KNOWN_HOSTS }}
          SG_PRODUCTION_DEPLOY_PATH: ${{ secrets.SG_PRODUCTION_DEPLOY_PATH }}

      - name: Download exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: production-candidate-${{ github.sha }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/production-candidate-${{ github.sha }}
      - name: Verify immutable artifact and stage frontend without rebuilding
        run: |
          node infrastructure/scripts/verify-stape-invariants.mjs
          node infrastructure/scripts/stage-production-candidate.mjs

      - name: Verify live CMS supports contact and career forms
        if: ${{ inputs.mode == 'deploy' }}
        run: node infrastructure/scripts/smoke-cms-forms.mjs

      - name: Verify candidate integrity immediately before publication
        if: ${{ inputs.mode == 'deploy' }}
        run: node infrastructure/scripts/verify-production-candidate.mjs

      - name: Production deploy dry-run
        if: ${{ inputs.mode == 'deploy' }}
        run: infrastructure/scripts/deploy-production.sh --dry-run --host netmarket.it --path "$SG_PRODUCTION_DEPLOY_PATH"
        env:
          SG_SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_SSH_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_SSH_USER: ${{ secrets.SG_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_SSH_KNOWN_HOSTS }}
          SG_PRODUCTION_DEPLOY_PATH: ${{ secrets.SG_PRODUCTION_DEPLOY_PATH }}

      - name: Deploy production atomically
        if: ${{ inputs.mode == 'deploy' }}
        run: infrastructure/scripts/deploy-production.sh --execute --host netmarket.it --path "$SG_PRODUCTION_DEPLOY_PATH"
        env:
          SG_SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_SSH_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_SSH_USER: ${{ secrets.SG_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_SSH_KNOWN_HOSTS }}
          SG_PRODUCTION_DEPLOY_PATH: ${{ secrets.SG_PRODUCTION_DEPLOY_PATH }}

      - name: Mark deploy completed
        if: ${{ inputs.mode == 'deploy' }}
        run: echo "DEPLOY_COMPLETED=true" >> "$GITHUB_ENV"

      - name: Verify deployed artifact over SSH
        if: ${{ inputs.mode == 'deploy' }}
        run: infrastructure/scripts/verify-production-release.sh --host netmarket.it --path "$SG_PRODUCTION_DEPLOY_PATH" --sha "$GITHUB_SHA"
        env:
          SG_SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_SSH_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_SSH_USER: ${{ secrets.SG_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_SSH_KNOWN_HOSTS }}
          SG_PRODUCTION_DEPLOY_PATH: ${{ secrets.SG_PRODUCTION_DEPLOY_PATH }}

      - name: Detect SiteGround production runner challenge
        if: ${{ inputs.mode == 'deploy' }}
        id: production_challenge
        run: node infrastructure/scripts/detect-production-challenge.mjs

      - name: Production smoke
        if: ${{ inputs.mode == 'deploy' && steps.production_challenge.outputs.challenged != 'true' }}
        run: node infrastructure/scripts/smoke-production.mjs
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
      - name: SEO smoke
        if: ${{ inputs.mode == 'deploy' && steps.production_challenge.outputs.challenged != 'true' }}
        run: node infrastructure/scripts/seo-smoke-production.mjs
      - name: Validate every legacy redirect
        if: ${{ inputs.mode == 'deploy' && steps.production_challenge.outputs.challenged != 'true' }}
        run: node infrastructure/scripts/validate-production-redirects.mjs

      - name: Record deferred public validation
        if: ${{ inputs.mode == 'deploy' && steps.production_challenge.outputs.challenged == 'true' }}
        run: |
          echo "::warning::SiteGround ha intercettato il runner GitHub con la challenge HTTP 202. Artifact verificato via SSH; smoke, SEO e redirect pubblici devono essere eseguiti da una rete esterna."
          echo "### Validazione pubblica differita" >> "$GITHUB_STEP_SUMMARY"
          echo "SiteGround ha restituito la challenge HTTP 202 al runner GitHub. L'artifact live e stato verificato via SSH; completare smoke, SEO e redirect da una rete esterna." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redirect report
        if: ${{ always() && inputs.mode == 'deploy' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-redirect-report-${{ github.sha }}
          path: artifacts/production-redirect-report.*
          if-no-files-found: ignore

      - name: Automatic rollback after failed post-deploy validation
        if: ${{ failure() && env.DEPLOY_COMPLETED == 'true' && inputs.mode == 'deploy' }}
        run: |
          set -Eeuo pipefail
          args=(--host netmarket.it --path "$SG_PRODUCTION_DEPLOY_PATH" --snapshot "before-$PUBLIC_BUILD_SHA" --current "$PUBLIC_BUILD_SHA" --restore "$EXPECTED_LIVE_SHA")
          plan="$(bash infrastructure/scripts/manual-rollback-production.sh --dry-run "${args[@]}")"
          printf '%s\n' "$plan"
          digest="$(printf '%s\n' "$plan" | sed -n 's/^digest=//p')"
          bash infrastructure/scripts/manual-rollback-production.sh --execute "${args[@]}" --digest "$digest" --confirm "ROLLBACK NETMARKET $PUBLIC_BUILD_SHA TO $EXPECTED_LIVE_SHA"
        env:
          SG_SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_SSH_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_SSH_USER: ${{ secrets.SG_SSH_USER }}
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_SSH_KNOWN_HOSTS }}
          SG_PRODUCTION_DEPLOY_PATH: ${{ secrets.SG_PRODUCTION_DEPLOY_PATH }}
